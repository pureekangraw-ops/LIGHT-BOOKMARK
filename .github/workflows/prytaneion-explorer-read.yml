name: PRYTANEION Legacy Provider Read-only
on:
  push:
    branches: ["feat/prytaneion-readonly-service-20261022"]
  pull_request:
    paths:
      - "src/legacy-explorer-read.js"
      - "src/index.js"
      - "test/legacy-explorer-read.test.js"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/legacy-explorer-read.test.js
      - run: npm test
