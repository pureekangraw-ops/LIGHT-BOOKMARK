name: LIGHT Drive Bridge Tests
on:
  push:
    branches:
      - feat/light-drive-via-pantheon-20261017
  pull_request:
    paths:
      - 'src/drive-bridge.js'
      - 'src/drive-bridge-write.test.js'
      - '.github/workflows/light-drive-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
