name = "light-bookmark"
main = "src/legacy-entrypoint.js"
compatibility_date = "2026-10-10"

[vars]
LIGHT_GITHUB_REPOS = "pureekangraw-ops/Go-Together,pureekangraw-ops/LIGHT-BOOKMARK,pureekangraw-ops/Pantheon-WorkHub,pureekangraw-ops/yggmetro-web"
LIGHT_GITLAB_PROJECTS = "yggmetro-group1/factory-district"
LIGHT_CF_WORKERS = "light-bookmark,go-together,phatheon-workhub,factory-district1"
# For Cloudflare account deployment metadata, set LIGHT_CF_ACCOUNT_ID as a variable
# and LIGHT_CF_READ_TOKEN as a scoped secret. GitHub and GitLab read tokens are optional
# for public repositories; use LIGHT_GITHUB_READ_TOKEN/LIGHT_GITLAB_READ_TOKEN for private.


# Bind account-level provider tokens from the existing Cloudflare Secrets Store.
# Values remain in Cloudflare and are read asynchronously by LIGHT Bookmark.
[[secrets_store_secrets]]
binding = "LIGHT_GITHUB_READ_TOKEN_STORE"
store_id = "8de46cb689fc4779875025b618d3bbd4"
secret_name = "GITHUB_TOKEN"

[[secrets_store_secrets]]
binding = "LIGHT_GITLAB_READ_TOKEN_STORE"
store_id = "8de46cb689fc4779875025b618d3bbd4"
secret_name = "GITLAB_TOKEN"

[[secrets_store_secrets]]
binding = "LIGHT_CF_READ_TOKEN_STORE"
store_id = "8de46cb689fc4779875025b618d3bbd4"
secret_name = "CLOUDFLARE_TOKEN"

# Bind the existing D1 database by inserting its real ID before deploying.
[[d1_databases]]
binding = "BOOKMARKS"
database_name = "lightbookmarks"
database_id = "28abed4a-081a-4927-a3ac-2ac31aca3177"

# Set LIGHT_BOOKMARK_TOKEN as a Worker secret; never commit it.

# Read-only access to the existing PANTHEON production Worker via internal routing.
# No WORKHUB_TOKEN is copied into LIGHT-BOOKMARK.
[[services]]
binding = "PANTHEON"
service = "phatheon-workhub"

# Task preparation through PANTHEON's restricted LightBridge RPC entrypoint.
# This has NO access to PANTHEON's OwnerBridge, deploy, dispatch or secrets.
[[services]]
binding = "PANTHEON_LIGHT"
service = "phatheon-workhub"
entrypoint = "LightBridge"

# Preview uses separate variables and a dedicated test database.
# Set a real non-production D1 database ID before running wrangler preview.
# Never copy the production BOOKMARKS database ID into previews.
#
# [previews.vars]
# LIGHT_GITHUB_REPOS = "pureekangraw-ops/LIGHT-BOOKMARK"
# LIGHT_GITLAB_PROJECTS = "yggmetro-group1/factory-district"
# LIGHT_CF_WORKERS = "light-bookmark"
#
# [[previews.d1_databases]]
# binding = "BOOKMARKS"
# database_id = "REPLACE_WITH_SEPARATE_PREVIEW_D1_ID"

# Persist only sanitized application diagnostics; do not record invocation details.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1
persist = true

[observability.traces]
enabled = false
